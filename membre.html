<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Membre - CAC 40</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; margin: 0; text-align: center; }
        .header { background: #000; color: white; padding: 20px; font-weight: bold; }
        .card { background: white; margin: 20px auto; width: 90%; max-width: 500px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        .val { font-weight: bold; color: #28a745; text-align: right; }
        .tradingview-widget-container { margin-top: 20px; border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body>
    <div class="header">ESPACE MEMBRE PRIVÉ</div>
    <div class="container">
        <div class="card">
            <h2>Analyse du Jour</h2>
            <table>
                <tr><td>Tendance</td><td class="val">HAUSSIER ▲</td></tr>
                <tr><td>Volume</td><td class="val" style="color:orange;">NORMAL</td></tr>
            </table>

            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
                {
                  "symbol": "INDEX:PX1",
                  "width": "100%",
                  "height": "220",
                  "locale": "fr",
                  "dateRange": "12M",
                  "colorTheme": "light",
                  "trendLineColor": "rgba(41, 98, 255, 1)",
                  "underLineColor": "rgba(41, 98, 255, 0.3)",
                  "underLineBottomColor": "rgba(41, 98, 255, 0)",
                  "isTransparent": false,
                  "autosize": false,
                  "largeChartUrl": ""
                }
                </script>
            </div>
            <p style="font-size:0.8rem; color:#666; margin-top:10px;">Graphique officiel Euronext Paris</p>
        </div>
    </div>
</body>
</html>
