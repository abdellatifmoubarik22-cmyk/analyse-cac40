<!DOCTYPE html>
<html lang="fr">
<head>

        .btn-graph { display: block; background-color: #007bff; color: white; padding: 20px; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; margin-top: 20px; }

</head>
<body>
    <div class="header-title">BIENVENUE DANS VOTRE ESPACE PRIVÉ</div>
