<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Membre</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f9; }
        .header { background: #000; color: white; padding: 20px; text-align: center; font-weight: bold; }
        .container { padding: 15px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; margin: auto; }
        table { width: 100%; margin: 15px 0; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        .signal { font-weight: bold; color: #28a745; text-align: right; }
    </style>
</head>
<body>
    <div class="header">ESPACE MEMBRE PRIVÉ</div>
    <div class="container">
        <div class="card">
            <h2 style="color:#007bff; margin-top:0;">Analyse du Jour</h2>
            <table>
                <tr><td>Tendance Fond</td><td class="signal">HAUSSIER ▲</td></tr>
                <tr><td>Volume</td><td class="signal" style="color:orange;">NORMAL</td></tr>
            </table>

            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
                {
                  "symbol": "INDEX:PX1",
                  "width": "100%",
                  "height": "220",
                  "locale": "fr",
                  "dateRange": "12M",
                  "colorTheme": "light",
                  "isTransparent": false,
                  "autosize": false
                }
                </script>
            </div>
            
            <p style="margin-top:20px; font-size:0.9rem;">
                <a href="https://fr.tradingview.com/chart/?symbol=INDEX:PX1" target="_blank" style="color:#007bff; font-weight:bold; text-decoration:none;">
                    📊 CLIQUER ICI POUR LE GRAPHIQUE PLEIN ÉCRAN
                </a>
            </p>
        </div>
    </div>
</body>
</html>
