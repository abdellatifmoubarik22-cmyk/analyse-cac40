<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Membre</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f9; color: #333; }
        .header { background: #000; color: white; padding: 20px; text-align: center; font-weight: bold; }
        .container { padding: 15px; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; margin: auto; }
        .stats { width: 100%; margin: 20px 0; }
        .stats td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        .signal { font-weight: bold; color: #28a745; text-align: right; }
        .btn-chart { display: block; background: #007bff; color: white; padding: 20px; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">ESPACE MEMBRE PRIVÉ</div>
    <div class="container">
        <div class="card">
            <h2 style="color:#007bff; margin-top:0;">Analyse du Jour</h2>
            <table class="stats">
                <tr><td>Tendance Fond</td><td class="signal">HAUSSIER ▲</td></tr>
                <tr><td>Volume</td><td class="signal" style="color:orange;">MODÉRÉ</td></tr>
            </table>
            <p style="text-align:left; font-size:0.9rem;"><strong>Note :</strong> Marché solide. Cliquez ci-dessous pour le cours en direct.</p>
            <a href="https://fr.tradingview.com/chart/?symbol=CAPITALCOM:FRA40" target="_blank" class="btn-chart">
                📊 VOIR LE GRAPHIQUE LIVE
            </a>
        </div>
    </div>
</body>
</html>
