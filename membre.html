<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Membre - Analyses CAC40</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f9; color: #333; }
        .header { background: #000; color: white; padding: 15px; text-align: center; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
        .container { max-width: 600px; margin: 20px auto; padding: 10px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #007bff; margin-top: 0; font-size: 1.5rem; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .status-up { color: #28a745; font-weight: bold; }
        .status-neutral { color: #ff8c00; font-weight: bold; }
        .tradingview-widget-container { margin-top: 20px; border-radius: 10px; overflow: hidden; min-height: 400px; }
    </style>
</head>
<body>

    <div class="header">Espace Membre Privé - Analyses CAC40</div>

    <div class="container">
        <div class="card">
            <h2>Tableau de Bord Stratégique</h2>
            
            <table>
                <tr>
                    <th>Indicateur</th>
                    <th>Signal</th>
                </tr>
                <tr>
                    <td>Tendance Fond</td>
                    <td class="status-up">HAUSSIER</td>
                </tr>
                <tr>
                    <td>Volume</td>
                    <td class="status-neutral">MODÉRÉ</td>
                </tr>
            </table>

            <div class="tradingview-widget-container">
                <div id="tradingview_cac40"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                new TradingView.widget({
                  "width": "100%",
                  "height": 400,
                  "symbol": "TVC:PX1",
                  "interval": "D",
                  "timezone": "Europe/Paris",
                  "theme": "light",
                  "style": "1",
                  "locale": "fr",
                  "toolbar_bg": "#f1f3f6",
                  "enable_publishing": false,
                  "hide_top_toolbar": false,
                  "hide_legend": false,
                  "save_image": false,
                  "container_id": "tradingview_cac40"
                });
                </script>
            </div>
        </div>
    </div>

</body>
</html>
