<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Membre - Analyses CAC40</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f9; color: #333; }
        .header { background: #000; color: white; padding: 15px; text-align: center; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
        .container { max-width: 600px; margin: 20px auto; padding: 10px; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #007bff; margin-top: 0; font-size: 1.5rem; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .status-up { color: #28a745; font-weight: bold; }
        .status-neutral { color: #ff8c00; font-weight: bold; }
        .tradingview-widget-container { margin-top: 20px; border: 1px solid #eee; border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="header">Espace Membre Privé - Analyses CAC40</div>

    <div class="container">
        <div class="card">
            <h2>Tableau de Bord Stratégique</h2>
            
            <table>
                <tr>
                    <th>Indicateur</th>
                    <th>Signal</th>
                </tr>
                <tr>
                    <td>Tendance Fond</td>
                    <td class="status-up">HAUSSIER</td>
                </tr>
                <tr>
                    <td>Volume</td>
                    <td class="status-neutral">MODÉRÉ</td>
                </tr>
            </table>

            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
                {
                  "colorTheme": "light",
                  "dateRange": "12M",
                  "showChart": true,
                  "locale": "fr",
                  "width": "100%",
                  "height": 400,
                  "largeChartUrl": "",
                  "isTransparent": false,
                  "showSymbolLogo": true,
                  "showFloatingTooltip": false,
                  "tabs": [
                    {
                      "title": "Indice",
                      "symbols": [
                        {
                          "proName": "FOREXCOM:FRA40",
                          "displayName": "CAC 40"
                        }
                      ]
                    }
                  ]
                }
                </script>
            </div>
            
            <p style="text-align: center; color: #888; font-size: 0.8rem; margin-top: 15px;">Cours mis à jour en temps réel</p>
        </div>
    </div>

</body>
</html>
