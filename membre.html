<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Membre - CAC 40</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; text-align: center; }
        .container { padding: 20px; }
        .card { background: white; padding: 20px; margin: 20px auto; width: 90%; max-width: 600px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>
    <h1>Bienvenue dans votre Espace Privé</h1>
    <div class="container">
        <div class="card">
            <h2>Analyse du Jour</h2>
            <table>
                <tr>
                    <th>Indicateur</th>
                    <th>Valeur / Signal</th>
                </tr>
                <tr>
                    <td>Tendance</td>
                    <td style="color: green; font-weight: bold;">HAUSSIER</td>
                </tr>
                <tr>
                    <td>Volume</td>
                    <td>Normal</td>
                </tr>
            </table>
        </div>

        <div class="card">
            <h2>Graphique en Direct</h2>
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
                {
                  "colorTheme": "light",
                  "dateRange": "12M",
                  "showChart": true,
                  "locale": "fr",
                  "width": "100%",
                  "height": "400",
                  "largeChartUrl": "",
                  "isTransparent": false,
                  "showSymbolLogo": true,
                  "showFloatingTooltip": false,
                  "tabs": [
                    {
                      "title": "Indices",
                      "symbols": [
                        {
                          "proName": "CAPITALCOM:FRA40",
                          "displayName": "CAC 40"
                        }
                      ]
                    }
                  ]
                }
                </script>
            </div>
        </div>
    </div>
</body>
</html>
