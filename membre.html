<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Membre - Analyses CAC40</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f9; color: #333; }
        .header { background: #000; color: white; padding: 15px; text-align: center; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
        .container { max-width: 600px; margin: 20px auto; padding: 10px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #007bff; margin-top: 0; font-size: 1.5rem; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .status-up { color: #28a745; font-weight: bold; }
        .status-neutral { color: #ff8c00; font-weight: bold; }
        .tradingview-widget-container { margin-top: 20px; min-height: 200px; }
    </style>
</head>
<body>

    <div class="header">Espace Membre Privé - Analyses CAC40</div>

    <div class="container">
        <div class="card">
            <h2>Tableau de Bord Stratégique</h2>
            
            <table>
                <tr>
                    <th>Indicateur</th>
                    <th>Signal</th>
                </tr>
                <tr>
                    <td>Tendance Fond</td>
                    <td class="status-up">HAUSSIER</td>
                </tr>
                <tr>
                    <td>Volume</td>
                    <td class="status-neutral">MODÉRÉ</td>
                </tr>
            </table>

            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
                {
                  "symbol": "CAPITALCOM:FRA40",
                  "width": "100%",
                  "height": 220,
                  "locale": "fr",
                  "dateRange": "12M",
                  "colorTheme": "light",
                  "trendLineColor": "rgba(41, 98, 255, 1)",
                  "underLineColor": "rgba(41, 98, 255, 0.3)",
                  "underLineBottomColor": "rgba(41, 98, 255, 0)",
                  "isTransparent": false,
                  "autosize": false,
                  "largeChartUrl": ""
                }
                </script>
            </div>
            
            <p style="font-size: 0.8rem; color: #888; text-align: center; margin-top: 15px;">
                Mise à jour en temps réel (Cours CAPITALCOM)
            </p>
        </div>
    </div>

</body>
</html>
